# ==========================================================================
# LIMO Nav2 파라미터 (LIMO 단독, 빈 지도, 메카넘/전방향 모드)
# ==========================================================================
#
# 대상: ROS 2 Humble / Ubuntu 22.04. 
#
#
# 메카넘(전방향) 전환: controller_server 의 FollowPath 를 DWB -> MPPI(motion_model: Omni).
# MPPI 파라미터 이름은 navigation2 humble 브랜치 nav2_mppi_controller 소스에서 확인한 것.
# (설치: sudo apt install ros-humble-nav2-mppi-controller)
# 나머지 서버(bt_navigator, planner, costmap, behavior)는 차동 버전과 동일.
#
# ==========================================================================

# --- BT Navigator: navigate_to_pose action 서버를 여는 노드 ---
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

# --- Controller Server: 경로 추종 -> /cmd_vel(vx, vy, wz) 생성 ---
controller_server:
  ros__parameters:
    controller_frequency: 20.0        # MPPI model_dt(0.05) = 1 / 20 Hz 와 맞춤
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001   # 메카넘: odom 의 옆 속도(linear.y)도 현재 속도로 사용
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"   # Humble: 단수형 문자열
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      # 전방향은 이동 중에도 헤딩을 따로 맞출 수 있으므로 목표 헤딩을 지킨다.
      # (차동 버전은 맴돌기 방지로 6.28 = 헤딩 무시였음)
      # 헤딩을 끝까지 고정하고 싶으면 목표 orientation 을 현재 헤딩과 같게 보낸다.
      yaw_goal_tolerance: 0.15
      stateful: True

    # ---------------- MPPI (Nav2 공식 예측 제어기, 전방향 지원) ----------------
    # 헤딩 고정 + 옆·대각 이동을 만드는 세 가지 설정:
    #   (1) motion_model: "Omni" + vy_max > 0  -> vy 를 샘플링해 옆·대각 궤적 생성
    #   (2) TwirlingCritic 추가               -> 이동 중 불필요한 yaw 회전에 벌점 (헤딩 유지)
    #   (3) PreferForwardCritic / PathAngleCritic 제외
    #       -> 둘 다 '정면으로 경로를 향해 가라'는 차동식 선호라 옆이동·헤딩 고정과 충돌
    # 결과: 이동 중에는 헤딩을 유지한 채 옆·대각으로 가고, 목표 0.5 m 안에서
    #       GoalAngleCritic 이 목표 헤딩으로 맞춘다.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Omni"
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000               # 시뮬 부하 고려 (공식 예시 2000)
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      # --- 속도 한계: LIMO 실물 스펙(약 0.2 m/s) 기준. 옆 속도는 전진보다 낮게 (실물 메카넘 특성) ---
      #     mecanum_driver 의 안전 상한(limo.urdf: maxVx 0.3, maxVy 0.2, maxWz 1.5)보다 작게 둔다.
      vx_max: 0.22
      vx_min: -0.22                  # 전방향: 후진도 정상 이동
      vy_max: 0.15                   # 좌우 각각 최대
      wz_max: 1.0
      # --- 샘플링 폭 (클수록 과감한 궤적 탐색) ---
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      prune_distance: 1.7
      transform_tolerance: 0.1
      reset_period: 1.0
      retry_attempt_limit: 1
      visualize: false
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "TwirlingCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5
        critical_weight: 20.0
        consider_footprint: false    # robot_radius 사용
        collision_cost: 10000.0
        collision_margin_distance: 0.1
        near_goal_distance: 0.5
        # 아래 두 값은 costmap inflation_layer 와 반드시 같아야 한다
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false   # 경로의 방향이 아니라 위치만 따라감 (헤딩 고정)
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0            # 헤딩 유지 강도. 이동 중 머리가 돌면 올리고, 목표 헤딩 맞추기가 느리면 내림

# --- Global Costmap: 전역 지도 (빈 지도) ---
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.18        # LIMO 대략 반경
      resolution: 0.05
      track_unknown_space: false
      # 빈 지도: 외부 map 없이 고정 크기 costmap 사용.
      # rolling_window=true + 14m 창: 아레나(10x10) 어디서든 목표가 창 안에 들어오도록 (한 축 최대 이동 6.5m < 7m)
      rolling_window: true
      width: 14
      height: 14
      # static_layer 제거 (외부 /map 안 씀), scan 기반 obstacle + inflation 만 유지
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

# --- Local Costmap: 지역 지도 (로봇 주변) ---
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.18
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

# --- Planner Server: 전역 경로 계획 ---
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# --- Behavior Server: 복구 동작 (후진, 회전 등) ---
behavior_server:
  ros__parameters:
    # Humble 은 local/global 을 나누지 않고 costmap 하나만 받는다.
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    # Humble 의 global_frame 은 "복구 동작이 도는 기준 프레임" -> map 이 아니라 odom.
    # (launch 의 make_nav2_params 가 {ns}/odom 으로 치환해준다)
    global_frame: odom
    robot_base_frame: base_link
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    # Humble pluginlib 등록 이름은 슬래시 표기 (Jazzy 는 :: 표기)
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
